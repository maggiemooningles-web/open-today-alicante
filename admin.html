<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Today Alicante · Data Console</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,ui-sans-serif,system-ui;background:#f6f8f6}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 10px 30px rgba(15,23,42,.05)}</style></head><body class="text-slate-900"><main class="max-w-6xl mx-auto p-6 sm:p-10"><div class="mb-8"><div class="text-xs font-black tracking-[.16em] text-emerald-700">OPEN TODAY ALICANTE</div><h1 class="text-3xl sm:text-4xl font-black tracking-tight mt-2">Data console</h1><p class="text-slate-500 mt-2">Internal view for source freshness and the automatic verification pipeline.</p></div><div id="summary" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div><section class="card p-5 mb-6"><h2 class="font-black text-lg">Automatic updater</h2><p class="text-sm text-slate-500 mt-1">Runs every 6 hours through GitHub Actions. Only strong source matches update hours automatically.</p><div class="mt-4 grid md:grid-cols-3 gap-3 text-sm"><div class="bg-slate-50 rounded-xl p-3"><div class="text-slate-500">Last run</div><div id="lastRun" class="font-black mt-1">—</div></div><div class="bg-slate-50 rounded-xl p-3"><div class="text-slate-500">Hours updated</div><div id="hoursUpdated" class="font-black mt-1">—</div></div><div class="bg-slate-50 rounded-xl p-3"><div class="text-slate-500">Needs review</div><div id="needsReview" class="font-black mt-1">—</div></div></div></section><section class="card p-5"><h2 class="font-black text-lg mb-4">Configured sources</h2><div id="sources" class="space-y-2"></div></section></main><script>
(async()=>{const [stores,report,sources]=await Promise.all([fetch('/data/stores.json',{cache:'no-store'}).then(r=>r.json()),fetch('/data/update-report.json',{cache:'no-store'}).then(r=>r.json()),fetch('/data/source-registry.json',{cache:'no-store'}).then(r=>r.json())]);const mapped=stores.filter(s=>s.lat!=null&&s.lng!=null).length;const confirmed=stores.filter(s=>s.hoursVerified!==false).length;const cards=[['Locations',stores.length],['Mapped',`${mapped} (${Math.round(mapped/stores.length*100)}%)`],['Hours checked',`${confirmed} (${Math.round(confirmed/stores.length*100)}%)`],['Official-source records',stores.filter(s=>s.sourceType==='official-locator').length]];document.getElementById('summary').innerHTML=cards.map(c=>`<div class="card p-4"><div class="text-xs font-bold text-slate-500">${c[0]}</div><div class="text-2xl font-black mt-1">${c[1]}</div></div>`).join('');document.getElementById('lastRun').textContent=report.checkedAt||'Not run yet';document.getElementById('hoursUpdated').textContent=report.totals?.hoursUpdated??'—';document.getElementById('needsReview').textContent=report.totals?.flagged??'—';document.getElementById('sources').innerHTML=sources.map(s=>`<div class="flex items-center justify-between gap-4 p-3 rounded-xl bg-slate-50"><div><div class="font-bold text-sm">${s.name}</div><div class="text-xs text-slate-500 mt-0.5">${s.scope}</div></div><a class="text-xs font-bold text-emerald-700 hover:underline" target="_blank" rel="noopener" href="${s.url}">Source ↗</a></div>`).join('')})().catch(e=>document.body.insertAdjacentHTML('beforeend',`<div class="fixed bottom-4 right-4 bg-red-600 text-white p-3 rounded-xl">${e.message}</div>`));</script></body></html>
