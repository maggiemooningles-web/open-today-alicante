name: Refresh store data

on:
  push:
    paths:
      - 'scripts/**'
      - 'data/source-registry.json'
      - 'package.json'
      - '.github/workflows/refresh-data.yml'
      - '.github/workflows/discover-locations.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check source health
        run: node scripts/update-data.mjs

      - name: Ingest official open data
        run: node scripts/ingest-open-data.mjs

      - name: Ingest first-party locators
        run: node scripts/ingest-first-party.mjs

      - name: Deduplicate generated batch
        run: node scripts/dedupe-data.mjs

      - name: Save generated batch
        run: |
          cp data/stores.json /tmp/generated-stores.json
          cp data/update-report.json /tmp/generated-update-report.json

      - name: Merge onto latest remote dataset
        run: |
          git fetch origin main
          git show origin/main:data/stores.json > /tmp/remote-stores.json
          git show origin/main:data/update-report.json > /tmp/remote-update-report.json || echo '{}' > /tmp/remote-update-report.json
          node scripts/merge-generated-data.mjs /tmp/generated-stores.json /tmp/remote-stores.json
          node scripts/merge-reports.mjs /tmp/generated-update-report.json /tmp/remote-update-report.json
          node scripts/generate-sitemap.mjs

      - name: Show dataset size
        run: node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/stores.json','utf8'));console.log('Dataset records:',d.length);const k=d.reduce((a,x)=>(a[x.sourceType]=(a[x.sourceType]||0)+1,a),{});console.log(k);"

      - name: Commit refreshed dataset
        run: |
          git config user.name "Open Today Alicante Bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git show origin/main:data/stores.json > /tmp/remote-stores.json
            git show origin/main:data/update-report.json > /tmp/remote-update-report.json || echo '{}' > /tmp/remote-update-report.json
            git reset --hard origin/main
            cp /tmp/generated-stores.json /tmp/generated-stores.json.keep
            cp /tmp/generated-update-report.json /tmp/generated-update-report.json.keep
            cp /tmp/generated-stores.json /tmp/generated-stores.json
            cp /tmp/generated-update-report.json /tmp/generated-update-report.json
            node scripts/merge-generated-data.mjs /tmp/generated-stores.json /tmp/remote-stores.json
            node scripts/merge-reports.mjs /tmp/generated-update-report.json /tmp/remote-update-report.json
            node scripts/generate-sitemap.mjs
            git add data/stores.json data/update-report.json sitemap.xml
            git diff --cached --quiet && exit 0
            git commit -m "chore(data): refresh official and first-party sources"
            if git push; then exit 0; fi
            git reset --hard origin/main
          done
          echo "Failed to push after 3 attempts"
          exit 1
