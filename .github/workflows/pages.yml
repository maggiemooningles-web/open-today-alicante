name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate inline JavaScript
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [];
          let cursor = 0;
          while (true) {
            const open = html.indexOf('<script', cursor);
            if (open < 0) break;
            const openEnd = html.indexOf('>', open);
            if (openEnd < 0) break;
            const close = html.indexOf('</script>', openEnd + 1);
            if (close < 0) break;
            scripts.push(html.slice(openEnd + 1, close));
            cursor = close + 9;
          }
          const javascript = scripts.filter(body => body.includes('const ') || body.includes('function '));
          for (const [index, body] of javascript.entries()) {
            try {
              new Function(body);
            } catch (error) {
              console.error(`Inline script ${index} failed: ${error.message}`);
              process.exit(1);
            }
          }
          console.log(`Validated ${javascript.length} inline scripts.`);
          NODE

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
