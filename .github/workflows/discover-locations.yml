name: Discover more locations

on:
  push:
    paths:
      - 'scripts/ingest-osm.mjs'
      - 'scripts/dedupe-data.mjs'
      - '.github/workflows/discover-locations.yml'
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover additional locations
        run: node scripts/ingest-osm.mjs

      - name: Deduplicate and merge records
        run: node scripts/dedupe-data.mjs

      - name: Regenerate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit discovered locations
        run: |
          git config user.name "Open Today Alicante Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stores.json data/update-report.json sitemap.xml
          git diff --cached --quiet && exit 0
          git fetch origin main
          git reset --soft origin/main
          git reset
          git add data/stores.json data/update-report.json sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): discover additional locations"
          git push
