name: Discover more locations

on:
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/ingest-osm.mjs
      - data/source-registry.json

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover additional locations
        run: node scripts/ingest-osm.mjs

      - name: Commit discovered locations
        run: |
          git config user.name "Open Today Alicante Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stores.json data/update-report.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): discover additional locations"
          git push
