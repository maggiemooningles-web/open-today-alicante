name: Discover more locations
# Alicante-province scoped discovery keeps the directory geographically correct.
# OSM pruning keeps only Alicante-province discovery records in the published dataset.

on:
  push:
    paths:
      - 'scripts/ingest-osm.mjs'
      - 'scripts/dedupe-data.mjs'
      - 'scripts/merge-generated-data.mjs'
      - 'scripts/merge-reports.mjs'
      - '.github/workflows/discover-locations.yml'
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover additional locations
        run: node scripts/ingest-osm.mjs

      - name: Deduplicate generated batch
        run: node scripts/dedupe-data.mjs

      - name: Save generated batch
        run: |
          cp data/stores.json /tmp/generated-stores.json
          cp data/update-report.json /tmp/generated-update-report.json

      - name: Merge discovered batch onto latest remote
        run: |
          git fetch origin main
          git show origin/main:data/stores.json > /tmp/remote-stores.json
          git show origin/main:data/update-report.json > /tmp/remote-update-report.json || echo '{}' > /tmp/remote-update-report.json
          node scripts/merge-generated-data.mjs /tmp/generated-stores.json /tmp/remote-stores.json
          node scripts/merge-reports.mjs /tmp/generated-update-report.json /tmp/remote-update-report.json
          - name: Remove OSM records outside Alicante province
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const generated = JSON.parse(fs.readFileSync('/tmp/generated-stores.json', 'utf8'));
          const allowedOsmIds = new Set(generated.filter(s => s.sourceType === 'osm-discovery' && s.osmId).map(s => s.osmId));
          const path = 'data/stores.json';
          const stores = JSON.parse(fs.readFileSync(path, 'utf8'));
          const before = stores.length;
          const cleaned = stores.filter(s => s.sourceType !== 'osm-discovery' || !s.osmId || allowedOsmIds.has(s.osmId));
          fs.writeFileSync(path, JSON.stringify(cleaned, null, 2) + '\n');
          const reportPath = 'data/update-report.json';
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const sourceTypes = cleaned.reduce((acc, s) => {
            const key = s.sourceType || 'unknown';
            acc[key] = (acc[key] || 0) + 1;
            return acc;
          }, {});
          report.dataset = { ...(report.dataset || {}), totalRecords: cleaned.length, sourceTypes };
          report.scopeCleanup = { scope: 'OpenStreetMap Province of Alicante area', before, after: cleaned.length, removedOutOfScope: before - cleaned.length };
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify({ before, after: cleaned.length, removedOutOfScope: before - cleaned.length }));
          NODE
          node scripts/generate-sitemap.mjs

      - name: Show dataset size
        run: node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/stores.json','utf8'));console.log('Dataset records:',d.length);"

      - name: Commit discovered locations
        run: |
          git config user.name "Open Today Alicante Bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git show origin/main:data/stores.json > /tmp/remote-stores.json
            git show origin/main:data/update-report.json > /tmp/remote-update-report.json || echo '{}' > /tmp/remote-update-report.json
            git reset --hard origin/main
            node scripts/merge-generated-data.mjs /tmp/generated-stores.json /tmp/remote-stores.json
            node scripts/merge-reports.mjs /tmp/generated-update-report.json /tmp/remote-update-report.json
            - name: Remove OSM records outside Alicante province
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const generated = JSON.parse(fs.readFileSync('/tmp/generated-stores.json', 'utf8'));
          const allowedOsmIds = new Set(generated.filter(s => s.sourceType === 'osm-discovery' && s.osmId).map(s => s.osmId));
          const path = 'data/stores.json';
          const stores = JSON.parse(fs.readFileSync(path, 'utf8'));
          const before = stores.length;
          const cleaned = stores.filter(s => s.sourceType !== 'osm-discovery' || !s.osmId || allowedOsmIds.has(s.osmId));
          fs.writeFileSync(path, JSON.stringify(cleaned, null, 2) + '\n');
          const reportPath = 'data/update-report.json';
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const sourceTypes = cleaned.reduce((acc, s) => {
            const key = s.sourceType || 'unknown';
            acc[key] = (acc[key] || 0) + 1;
            return acc;
          }, {});
          report.dataset = { ...(report.dataset || {}), totalRecords: cleaned.length, sourceTypes };
          report.scopeCleanup = { scope: 'OpenStreetMap Province of Alicante area', before, after: cleaned.length, removedOutOfScope: before - cleaned.length };
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify({ before, after: cleaned.length, removedOutOfScope: before - cleaned.length }));
          NODE
            node scripts/generate-sitemap.mjs
            git add data/stores.json data/update-report.json sitemap.xml
            git diff --cached --quiet && exit 0
            git commit -m "chore(data): discover additional locations"
            if git push; then exit 0; fi
            git reset --hard origin/main
          done
          echo "Failed to push after 3 attempts"
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload updated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy updated site
        uses: actions/deploy-pages@v4

